# Unit tests on every push to main and every pull request, on the JAX CPU backend.
# GPU / ROCm / XPU runs are not part of CI; see docs/explanation/hardware.md.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q

  # One leg pinned to the jax/numpy versions mu2e-fastsim CI uses, so goldens do not drift.
  pytest-pinned:
    name: pytest (pinned jax/numpy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned
        run: |
          python -m pip install -e '.[test]'
          python -m pip install 'jax==0.11.2' 'numpy==2.5.4'
          python -c "import jax,numpy; print(jax.__version__, numpy.__version__)"
      - name: Test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q
