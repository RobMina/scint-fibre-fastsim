# Unit tests on every push to main and every pull request, on the JAX CPU backend.
# GPU / ROCm / XPU runs are not part of CI; see docs/explanation/hardware.md.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q

  # One leg pinned to the jax/numpy versions mu2e-fastsim CI uses, so goldens do not drift.
  pytest-pinned:
    name: pytest (pinned jax/numpy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned
        run: |
          python -m pip install -e '.[test]'
          python -m pip install 'jax==0.11.2' 'numpy==2.5.4'
          python -c "import jax,numpy; print(jax.__version__, numpy.__version__)"
      - name: Test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q

  citation:
    name: citation metadata (CITATION.cff, .zenodo.json)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate CITATION.cff and check the versions agree with pyproject.toml
        run: |
          python -m pip install -q cffconvert==2.0.0 pyyaml
          cffconvert --validate
          python - <<'PY'
          import json, tomllib, yaml
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          z = json.load(open(".zenodo.json"))["version"]
          c = str(yaml.safe_load(open("CITATION.cff"))["version"])
          assert v == z == c, (v, z, c)
          print("version", v)
          PY

  # The NOvA cell model against public data: the record must reproduce, and the benchmark bundle must build.
  validation-nova-cell:
    name: NOvA cell validation and benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[test,validation]'
      - name: Validation tests (record reproduces)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests/test_nova_timing.py
      - name: Benchmark build (scores, leaderboard, Codabench bundle)
        run: |
          python benchmarks/nova_cell/build.py "$RUNNER_TEMP/nova_cell"
          git diff --exit-code benchmarks/nova_cell/reference_results/LEADERBOARD.md || \
            (echo "LEADERBOARD.md is stale: rerun benchmarks/nova_cell/build.py" && exit 1)
