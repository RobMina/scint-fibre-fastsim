[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scint-fibre-fastsim"
version = "0.1.6"
description = "Experiment-neutral scintillator + WLS-fibre optical Monte Carlo and lookup-table generator for fast detector simulation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
jax = ["jax"]
test = ["pytest", "jax"]

[project.urls]
Homepage = "https://github.com/RobMina/scint-fibre-fastsim"
Repository = "https://github.com/RobMina/scint-fibre-fastsim"
Issues = "https://github.com/RobMina/scint-fibre-fastsim/issues"

[tool.setuptools.packages.find]
include = ["scintfibrefastsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
