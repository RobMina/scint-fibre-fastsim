[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scint-fibre-fastsim"
version = "0.1.6"
description = "Experiment-neutral scintillator + WLS-fibre optical Monte Carlo and lookup-table generator for fast detector simulation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
jax = ["jax"]
test = ["pytest", "jax"]
# validation/nova_cell and benchmarks/nova_cell: the scorer (hep-simbench, pinned) and JAX
validation = ["jax", "hep-simbench @ git+https://github.com/RobMina/hep-simbench.git@f9663306da82a3943c9c73ec629a5b686747fb28"]
# validation/nova_cell/extract.py: reading the source PDFs (permissive licences only)
extract = ["pdfminer.six", "pypdf", "pillow", "scipy"]

[project.urls]
Homepage = "https://github.com/RobMina/scint-fibre-fastsim"
Repository = "https://github.com/RobMina/scint-fibre-fastsim"
Issues = "https://github.com/RobMina/scint-fibre-fastsim/issues"

[tool.setuptools.packages.find]
include = ["scintfibrefastsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
